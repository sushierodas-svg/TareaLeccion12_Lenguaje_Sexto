<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro Plus / Delta - Colegio Escolaris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --naranja: #db6015;
            --amarillo: #f7be00;
            --azul-oscuro: #244b5a;
            --azul-claro: #f0f8ff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e7eb;
            color: var(--azul-oscuro);
            padding: 20px;
        }

        #capture-area {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            background-image: 
                linear-gradient(#f0f8ff 1px, transparent 1px),
                linear-gradient(90deg, #f0f8ff 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .header-escolaris {
            background-color: var(--azul-oscuro);
            color: white;
            padding: 25px 30px;
            position: relative;
        }

        /* Ajuste para que el texto nunca se corte */
        textarea {
            width: 100%;
            min-height: 150px;
            resize: none;
            border: none;
            background-color: transparent;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #374151;
            padding: 10px 5px;
            display: block;
            overflow: hidden; /* Elimina barras de desplazamiento en la imagen */
        }

        textarea:focus { outline: none; }

        .column-plus { border-top: 5px solid #10b981; background-color: rgba(16, 185, 129, 0.03); }
        .column-delta { border-top: 5px solid var(--naranja); background-color: rgba(219, 96, 21, 0.03); }

        .btn-download {
            background-color: var(--naranja);
            color: white;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-nombre {
            border: 0;
            border-bottom: 2px solid var(--azul-oscuro);
            background: transparent;
            font-weight: 600;
            padding: 5px;
            width: 100%;
        }

        /* Modal */
        #safe-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(36, 75, 90, 0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #result-image { max-width: 100%; max-height: 70vh; border-radius: 8px; border: 4px solid white; }
        
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--naranja);
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="flex flex-col items-center">
        
        <div id="capture-area">
            <div class="header-escolaris">
                <h1 class="text-3xl font-extrabold uppercase">Tarea / Investigación</h1>
                <p class="opacity-90 font-semibold">Técnicas de Estudio</p>
            </div>

            <div class="p-6 sm:p-10">
                <div class="mb-6">
                    <label class="font-bold text-gray-700">Nombre del estudiante:</label>
                    <input type="text" id="student-name" class="input-nombre" placeholder="Escribe aquí...">
                </div>

                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded mb-8">
                    <p class="text-sm text-gray-700"><strong>Instrucciones:</strong> Completa el cuadro PLUS (fortalezas) y DELTA (oportunidades de mejora).</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- PLUS -->
                    <div class="column-plus rounded-xl p-5 border border-gray-100">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="bg-emerald-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">+</span>
                            <h2 class="text-xl font-extrabold text-emerald-700">PLUS</h2>
                        </div>
                        <p class="text-[10px] text-emerald-600 font-bold uppercase mb-2">Mis fortalezas:</p>
                        <textarea placeholder="Escribe aquí..." oninput="autoResize(this)"></textarea>
                    </div>

                    <!-- DELTA -->
                    <div class="column-delta rounded-xl p-5 border border-gray-100">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">Δ</span>
                            <h2 class="text-xl font-extrabold text-orange-700">DELTA</h2>
                        </div>
                        <p class="text-[10px] text-orange-600 font-bold uppercase mb-2">Por mejorar:</p>
                        <textarea placeholder="Escribe aquí..." oninput="autoResize(this)"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-50 text-center py-3 text-[10px] text-gray-400 font-bold border-t border-gray-200">
                Colegio Escolaris • Plataforma de Estrategias de Aprendizaje
            </div>
        </div>

        <div class="w-full max-w-md">
            <div id="loading" class="loader"></div>
            <button id="downloadBtn" class="btn-download" onclick="generarImagen()">
                Terminar y Descargar Trabajo
            </button>
        </div>
    </div>

    <div id="safe-modal">
        <h2 class="text-xl font-bold text-white mb-4">¡Listo! Mantén presionada la imagen para guardar</h2>
        <img id="result-image" src="">
        <button onclick="cerrarModal()" class="mt-6 bg-white px-8 py-2 rounded-full font-bold">Volver a editar</button>
    </div>

    <script>
        // Función para que el cuadro crezca solo
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        async function generarImagen() {
            const btn = document.getElementById('downloadBtn');
            const loader = document.getElementById('loading');
            const nombre = document.getElementById('student-name').value.trim() || 'Estudiante';
            
            // Forzar que todos los textareas se ajusten antes de la foto
            document.querySelectorAll('textarea').forEach(tx => autoResize(tx));

            btn.style.display = 'none';
            loader.style.display = 'block';

            // Pequeña pausa para que el navegador renderice los cambios de altura
            await new Promise(resolve => setTimeout(resolve, 300));

            try {
                const canvas = await html2canvas(document.getElementById('capture-area'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                
                // Mostrar en modal (más seguro para celulares)
                document.getElementById('result-image').src = imgData;
                document.getElementById('safe-modal').style.display = 'flex';

                // Intento de descarga automática
                const link = document.createElement('a');
                link.download = `Tarea_${nombre}.png`;
                link.href = imgData;
                link.click();

            } catch (e) {
                alert("Error al crear la imagen. Intenta tomar una captura de pantalla.");
            } finally {
                loader.style.display = 'none';
                btn.style.display = 'flex';
            }
        }

        function cerrarModal() {
            document.getElementById('safe-modal').style.display = 'none';
        }
    </script>
</body>
</html>
