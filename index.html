<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro Plus / Delta - Colegio Escolaris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --naranja: #db6015; --azul-oscuro: #244b5a; }
        body { font-family: 'Nunito', sans-serif; background-color: #e5e7eb; padding: 20px; }
        
        #capture-area {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background-image: linear-gradient(#f0f8ff 1px, transparent 1px), linear-gradient(90deg, #f0f8ff 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .header-escolaris { background-color: var(--azul-oscuro); color: white; padding: 25px 30px; }

        /* ESTO SUSTITUYE AL TEXTAREA Y NO FALLA */
        .editable-box {
            width: 100%;
            min-height: 300px;
            padding: 10px;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #374151;
            outline: none;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap; /* Mantiene los saltos de línea */
            text-align: left;
        }

        .editable-box:empty:before {
            content: attr(data-placeholder);
            color: #9ca3af;
        }

        .column-plus { border-top: 5px solid #10b981; background-color: rgba(16, 185, 129, 0.03); }
        .column-delta { border-top: 5px solid var(--naranja); background-color: rgba(219, 96, 21, 0.03); }
        
        .input-nombre { border: 0; border-bottom: 2px solid var(--azul-oscuro); background: transparent; font-weight: 600; width: 100%; max-width: 300px; }
        
        #safe-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(36, 75, 90, 0.98); z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        #result-image { max-width: 100%; max-height: 70vh; border: 4px solid white; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="capture-area">
        <div class="header-escolaris">
            <h1 class="text-3xl font-extrabold uppercase">Tarea / Investigación</h1>
            <p class="opacity-90 font-semibold">Técnicas de Estudio</p>
        </div>

        <div class="p-6 sm:p-10">
            <div class="mb-8 flex items-center gap-3">
                <label class="font-bold text-gray-700">Nombre:</label>
                <input type="text" id="student-name" class="input-nombre" placeholder="Escribe tu nombre...">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- PLUS -->
                <div class="column-plus rounded-xl p-5 border border-gray-100">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center text-2xl font-bold">+</div>
                        <h2 class="text-2xl font-extrabold text-emerald-700">PLUS</h2>
                    </div>
                    <div id="plus-text" class="editable-box" contenteditable="true" data-placeholder="Escribe tus fortalezas aquí..."></div>
                </div>

                <!-- DELTA -->
                <div class="column-delta rounded-xl p-5 border border-gray-100">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-orange-500 text-white w-10 h-10 rounded-full flex items-center justify-center text-2xl font-bold">Δ</div>
                        <h2 class="text-2xl font-extrabold text-orange-700">DELTA</h2>
                    </div>
                    <div id="delta-text" class="editable-box" contenteditable="true" data-placeholder="Escribe lo que debes mejorar aquí..."></div>
                </div>
            </div>
        </div>
        
        <div class="bg-gray-50 text-center py-3 text-[10px] text-gray-400 font-bold border-t border-gray-200">
            Colegio Escolaris • Generado en plataforma interactiva
        </div>
    </div>

    <div class="flex justify-center mt-6">
        <button id="downloadBtn" onclick="generarImagen()" class="bg-[#db6015] text-white font-bold py-4 px-10 rounded-full shadow-lg hover:scale-105 transition">
            Terminar y Descargar Trabajo
        </button>
    </div>

    <div id="safe-modal">
        <h2 class="text-white text-xl font-bold mb-4 text-center">¡Trabajo Listo!<br>Manten presionada la imagen para guardar</h2>
        <img id="result-image" src="">
        <button onclick="document.getElementById('safe-modal').style.display='none'" class="mt-6 bg-white px-8 py-2 rounded-full font-bold">Volver</button>
    </div>

    <script>
        async function generarImagen() {
            const btn = document.getElementById('downloadBtn');
            const nombre = document.getElementById('student-name').value || 'Estudiante';
            btn.innerText = "Procesando...";

            try {
                const canvas = await html2canvas(document.getElementById('capture-area'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const imgData = canvas.toDataURL('image/png');
                document.getElementById('result-image').src = imgData;
                document.getElementById('safe-modal').style.display = 'flex';

                const link = document.createElement('a');
                link.download = `Tarea_${nombre.replace(/ /g, "_")}.png`;
                link.href = imgData;
                link.click();
            } catch (e) {
                alert("Error al generar la imagen. Toma una captura de pantalla.");
            } finally {
                btn.innerText = "Terminar y Descargar Trabajo";
            }
        }
    </script>
</body>
</html>
